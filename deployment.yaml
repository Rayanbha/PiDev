apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
  labels:
    app: java-app
spec:
  replicas: 3  # Number of Pods to run
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app-container
        image: rayanbha/stage:latest
        ports:
        - containerPort: 8080
        command: ["java", "-jar", "/Pidev3-1.0-SNAPSHOT.jar"]
